name: Release to NPM and GitHub

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and run all checks without publishing or releasing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.version-check.outputs.should-publish }}
      package-name: ${{ steps.version-check.outputs.package-name }}
      package-version: ${{ steps.version-check.outputs.package-version }}
      npm-version: ${{ steps.version-check.outputs.npm-version }}
      dist-tag: ${{ steps.version-check.outputs.dist-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check version difference
        id: version-check
        run: |
          # Get current package.json package name and version
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "package-name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "package-version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

          # Get latest NPM version (handle case where package doesn't exist yet)
          NPM_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")
          echo "npm-version=$NPM_VERSION" >> $GITHUB_OUTPUT

          # Derive the npm dist-tag from the version string so pre-releases
          # never take the `latest` tag. Stable versions (no pre-release
          # suffix) publish to `latest`.
          case "$PACKAGE_VERSION" in
            *-alpha*) DIST_TAG="alpha" ;;
            *-beta*)  DIST_TAG="beta" ;;
            *-rc*)    DIST_TAG="rc" ;;
            *-*)      DIST_TAG="next" ;;
            *)        DIST_TAG="latest" ;;
          esac
          echo "dist-tag=$DIST_TAG" >> $GITHUB_OUTPUT
          echo "📦 npm dist-tag resolved to: $DIST_TAG"

          # Compare versions
          if [ "$PACKAGE_VERSION" != "$NPM_VERSION" ]; then
            echo "✅ New version detected: $PACKAGE_VERSION (current NPM: $NPM_VERSION)"
            echo "should-publish=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No version change detected: $PACKAGE_VERSION"
            echo "should-publish=false" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Verify NPM authentication
        if: github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.check-version.outputs.package-name }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=Missing NPM_TOKEN::This release publishes to npm, but the repository secret NPM_TOKEN is not configured."
            echo "Create an npm automation or granular access token with publish access to \"$PACKAGE_NAME\"."
            echo "Then add it in GitHub: Settings > Secrets and variables > Actions > New repository secret > NPM_TOKEN."
            exit 1
          fi

          npm whoami --registry=https://registry.npmjs.org

      - name: Install dependencies (including VS Code extension)
        run: pnpm install --frozen-lockfile

      - name: Generate credits
        run: pnpm run build:credits

      - name: Build project
        run: pnpm run build

      - name: Build VS Code extension
        run: pnpm run build:vscode

      - name: Check formatting
        run: pnpm test:format

      - name: Typecheck
        run: pnpm test:types

      - name: Lint
        run: pnpm test:lint

      - name: Run AVA tests
        run: pnpm test:ava

      - name: Check for unused code
        run: pnpm test:knip

      - name: Security audit
        run: pnpm test:audit

      - name: Semgrep security scan
        uses: docker://semgrep/semgrep:latest
        with:
          args: semgrep scan --config auto --error

      - name: Verify build output
        run: |
          if [ ! -f "dist/cli.js" ]; then
            echo "❌ Build failed: dist/cli.js not found"
            exit 1
          fi
          echo "✅ Build successful: dist/cli.js exists"
          if [ ! -f "assets/opencub-vscode.vsix" ]; then
            echo "❌ Build failed: VS Code extension not found"
            exit 1
          fi
          echo "✅ VS Code extension built: assets/opencub-vscode.vsix exists"

      - name: Publish to NPM
        if: github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.check-version.outputs.dist-tag }}
        run: npm publish --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org

      - name: Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.package-version }}
          name: opencub v${{ needs.check-version.outputs.package-version }}
          body: |
            ## Installation
            ```bash
            npm install -g opencub@${{ needs.check-version.outputs.dist-tag }}
            ```

            ## Usage
            ```bash
            cub
            ```
          draft: false
          prerelease: ${{ needs.check-version.outputs.dist-tag != 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification
        if: success() && github.event.inputs.dry_run != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PACKAGE_VERSION: ${{ needs.check-version.outputs.package-version }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No Discord webhook configured; skipping notification."
            exit 0
          fi

          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          PAYLOAD=$(jq -n \
            --arg version "$PACKAGE_VERSION" \
            --arg repo "$REPO_SLUG" \
            --arg timestamp "$TIMESTAMP" \
            '{
              embeds: [{
                title: ("🎉 New Release: OpenCub v" + $version),
                description: ("A new version of OpenCub has been released.\n\n[View the release on GitHub](https://github.com/" + $repo + "/releases/tag/v" + $version + ")"),
                color: 5763719,
                fields: [
                  {name: "Version", value: ("v" + $version), inline: true},
                  {name: "Installation", value: "`npm install -g opencub`", inline: false}
                ],
                footer: {text: "GitHub Actions"},
                timestamp: $timestamp,
                url: ("https://github.com/" + $repo + "/releases/tag/v" + $version)
              }]
            }')

          curl -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

  update-nix:
    needs: [check-version, publish]
    if: needs.check-version.outputs.should-publish == 'true' && github.event.inputs.dry_run != 'true'
    uses: ./.github/workflows/update-nix.yml
    with:
      version: ${{ needs.check-version.outputs.package-version }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  notify:
    needs: [check-version, publish, update-nix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify result
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          UPDATE_NIX_RESULT: ${{ needs.update-nix.result }}
          SHOULD_PUBLISH: ${{ needs.check-version.outputs.should-publish }}
          PACKAGE_VERSION: ${{ needs.check-version.outputs.package-version }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            if [ "$PUBLISH_RESULT" = "success" ]; then
              echo "✅ Dry run completed successfully for v$PACKAGE_VERSION (no publish, no release)."
            else
              echo "❌ Dry run failed for v$PACKAGE_VERSION"
              exit 1
            fi
          elif [ "$SHOULD_PUBLISH" = "true" ]; then
            if [ "$PUBLISH_RESULT" = "success" ]; then
              echo "🎉 Successfully published opencub v$PACKAGE_VERSION to NPM and created GitHub release!"
              if [ "$UPDATE_NIX_RESULT" = "success" ]; then
                echo "✅ Nix package updated successfully!"
              else
                echo "⚠️ Warning: Nix package update failed"
              fi
            else
              echo "❌ Failed to publish opencub v$PACKAGE_VERSION"
              exit 1
            fi
          else
            echo "ℹ️ No new version to publish (current: $PACKAGE_VERSION)"
          fi
